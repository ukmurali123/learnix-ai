<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learnix 3D Working Models</title>
<style>
html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0f172a;color:#0f172a;overflow:hidden}
*{box-sizing:border-box}
#app{display:flex;height:100%}
#stage{position:relative;flex:1 1 58%;min-width:0;background:#bfe3f7}
#stage canvas{display:block;width:100%;height:100%}
#badge{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;box-shadow:0 4px 14px rgba(15,23,42,.15)}
#status{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:7px 14px;border-radius:20px;font-weight:800;font-size:13px;background:#334155;color:#fff;white-space:nowrap}
#status.run{background:#0077b6}#status.bad{background:#dc2626}
#pins{position:absolute;left:12px;bottom:12px;background:rgba(15,23,42,.86);color:#e2e8f0;border-radius:12px;padding:8px 10px;font:12px/1.5 Consolas,monospace;min-width:230px;max-width:46%}
#pins .on{color:#4ade80;font-weight:700}#pins .lbl{color:#94a3b8}
#hint{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.85);border-radius:10px;padding:6px 10px;font-size:11.5px;color:#334155}
#panel{flex:0 0 42%;max-width:580px;min-width:330px;background:#f8fafc;overflow:auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.tab{border:1px solid #cbd5e1;background:#fff;border-radius:20px;padding:8px 12px;font-weight:800;font-size:12.5px;cursor:pointer;color:#334155}
.tab.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
.card{margin:0 12px 12px;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 6px 18px rgba(15,23,42,.06)}
.card h2{margin:0 0 6px;font-size:18px}.card p{margin:0;font-size:13.5px;line-height:1.55;color:#334155}
.sh{font-weight:900;font-size:12px;letter-spacing:.06em;color:#64748b;margin:0 0 8px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.boards{display:flex;gap:6px}.boards button{border:1px solid #cbd5e1;background:#fff;border-radius:16px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer}
.boards button.on{background:#0077b6;border-color:#0077b6;color:#fff}
table.parts{width:100%;border-collapse:collapse;font-size:12.5px}
table.parts td,table.parts th{padding:6px 4px;border-bottom:1px solid #eef2f7;text-align:left}
table.parts th{font-size:11px;color:#64748b;text-transform:uppercase}
table.parts code{background:#eef2ff;color:#3730a3;border-radius:5px;padding:1px 5px;font-weight:700}
.inp{margin:8px 0}.inp label{display:flex;justify-content:space-between;font-weight:800;font-size:13px}
.inp input[type=range]{width:100%}
.tgl{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid #e2e8f0;border-radius:12px;margin:6px 0;cursor:pointer;user-select:none;font-weight:800;font-size:13px}
.tgl .tg{width:46px;height:26px;border-radius:13px;background:#cbd5e1;position:relative;transition:.2s}
.tgl .tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tgl.on .tg{background:#16a34a}.tgl.on .tg::after{left:23px}
#code{width:100%;min-height:240px;resize:vertical;font:13px/1.5 Consolas,Menlo,monospace;background:#0b1220;color:#e2e8f0;border:0;border-radius:12px;padding:12px;outline:none;tab-size:2}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border-radius:10px;padding:9px 12px;font-weight:800;font-size:12.5px;cursor:pointer;border:1px solid #cbd5e1;background:#fff;color:#0f172a}
.run{background:#16a34a;color:#fff;border-color:#16a34a}.stop{background:#dc2626;color:#fff;border-color:#dc2626}
.zbtn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(135deg,#38bdf8,#0077b6,#7c3aed)}
#serial{height:100px;overflow:auto;background:#0b1220;color:#86efac;font:12px/1.45 Consolas,monospace;border-radius:10px;padding:8px;white-space:pre-wrap}
#serial .err{color:#fca5a5}
.how{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:#334155}
#ask{width:100%;margin-top:8px;padding:9px 10px;border:1px solid #cbd5e1;border-radius:10px;font-size:13px}
#zola{display:none;border-left:4px solid #7c3aed;background:#f5f3ff}
#zolaText{font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:#1e1b4b}
.zh{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:900;color:#5b21b6}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#0077b6,#7c3aed);display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.warn{display:none;margin-top:8px;padding:8px 10px;border-radius:10px;background:#fef2f2;color:#b91c1c;font-weight:800;font-size:12.5px}
#builder{display:none}
.cat{font-size:11px;font-weight:900;color:#7c3aed;text-transform:uppercase;letter-spacing:.05em;margin:8px 0 4px}
.kinds{display:flex;flex-wrap:wrap;gap:5px}.kinds button{border:1px solid #ddd6fe;background:#faf5ff;border-radius:10px;padding:6px 9px;font-size:12px;font-weight:700;cursor:pointer;color:#4c1d95}
.kinds button:hover{background:#ede9fe}
.insp{margin-top:12px;padding:10px;border-radius:12px;background:#f5f3ff;border:1px solid #ddd6fe}
.mini{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700}.mini input{flex:1}
.beh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#fff;border:1px solid #e9d5ff;border-radius:10px;padding:6px 8px;margin:4px 0;font-size:12.5px}
.beh button{margin-left:auto;border:0;background:#fee2e2;color:#b91c1c;border-radius:6px;cursor:pointer;font-weight:900}
.addbeh{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.addbeh select{padding:6px;border-radius:8px;border:1px solid #cbd5e1;font-size:12px}
.tip{font-size:12.5px;color:#64748b;margin:10px 0 0}
.tab.create{border-style:dashed;border-color:#7c3aed;color:#7c3aed}.tab.create.on{color:#fff}
@media (max-width:860px){#app{flex-direction:column}#stage{flex:0 0 50%}#panel{max-width:none;min-width:0;flex:1 1 auto}}
</style></head>
<body><div id="app">
<div id="stage"><div id="badge"></div><div id="status">Ready</div><div id="pins"></div><div id="hint">Drag to rotate · scroll to zoom</div></div>
<div id="panel">
  <div class="tabs" id="tabs"></div>
  <div class="card"><h2 id="title"></h2><p id="desc"></p><div class="warn" id="warn"></div></div>
  <div class="card" id="builder"></div>
  <div class="card"><div class="sh">Circuit <div class="boards"><button id="bUno">Arduino Uno</button><button id="bEsp">ESP32</button></div></div><table class="parts" id="parts"></table></div>
  <div class="card"><div class="sh">Sensors and inputs (change them while the code runs)</div><div id="inputs"></div></div>
  <div class="card"><div class="sh"><span id="codeTitle">Code</span></div><textarea id="code" spellcheck="false"></textarea>
    <div class="row"><button class="btn run" id="runBtn">&#9654; Upload &amp; Run</button><button class="btn stop" id="stopBtn">&#9632; Stop</button><button class="btn" id="resetBtn">&#8634; Reset code</button></div></div>
  <div class="card"><div class="sh">Serial Monitor</div><div id="serial"></div></div>
  <div class="card"><div class="sh">How it works</div><ol class="how" id="how"></ol></div>
  <div class="card"><button class="zbtn" id="zbtn">Ask Zola about this circuit</button><input id="ask" placeholder="Optional question, e.g. why do we need a relay for the pump?"></div>
  <div class="card" id="zola"><div class="zh"><div class="av"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><rect x="5" y="8" width="14" height="11" rx="3"/><rect x="11" y="3" width="2" height="4"/><circle cx="12" cy="3" r="1.6"/><circle cx="9.5" cy="13" r="1.6" fill="#0077b6"/><circle cx="14.5" cy="13" r="1.6" fill="#0077b6"/></svg></div>AI Tutor Zola</div><div id="zolaText"></div></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const has3D = typeof THREE !== 'undefined';
const stage = document.getElementById('stage');
let renderer, scene, camera, world, sun, hemi, clock = 0;
let camTheta = -0.6, camPhi = 0.95, camDist = 360;
let model = null, board = 'uno', anim = [];
const inputs = {};          // input id -> value (0..100 for sliders, 0/1 for toggles)
const sim = {};             // model-specific simulated values (tank level, box at sensor, ...)

// ---------------------------------------------------------------- 3D helpers
const M = (c, o) => new THREE.MeshStandardMaterial(Object.assign({color: c, roughness: .6, metalness: .05}, o || {}));
function box(w, h, d, c, x, y, z, o){ const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(c, o)); m.position.set(x||0, (y||0) + h/2, z||0); m.castShadow = m.receiveShadow = true; return m; }
function cyl(rt, rb, h, c, x, y, z, seg, o){ const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg||24), M(c, o)); m.position.set(x||0, (y||0) + h/2, z||0); m.castShadow = m.receiveShadow = true; return m; }
function sph(r, c, x, y, z, o){ const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), M(c, o)); m.position.set(x||0, y||0, z||0); m.castShadow = true; return m; }
function ground(w, d, c){ const g = box(w, 4, d, c, 0, -4, 0); g.castShadow = false; return g; }
function person(shirt, x, z, skin){ const g = new THREE.Group(); g.add(cyl(3, 3, 12, 0x1e293b, -2.2, 0, 0, 10)); g.add(cyl(3, 3, 12, 0x1e293b, 2.2, 0, 0, 10));
  g.add(box(10, 13, 6, shirt, 0, 12, 0)); g.add(sph(4.2, skin||0xf2c9a0, 0, 29, 0)); g.position.set(x, 0, z); return g; }
function tree(x, z){ const g = new THREE.Group(); g.add(cyl(2.5, 3, 16, 0x8b5a2b, 0, 0, 0, 10)); g.add(sph(12, 0x2f9e44, 0, 24, 0)); g.add(sph(9, 0x37b24d, 5, 30, 3)); g.position.set(x, 0, z); return g; }
function carMesh(color){ const g = new THREE.Group(); g.add(box(34, 8, 16, color, 0, 3, 0, {metalness: .3, roughness: .35})); g.add(box(18, 7, 14, 0x93c5fd, -2, 11, 0, {metalness: .2, roughness: .2}));
  for (const [x, z] of [[11, 8], [-11, 8], [11, -8], [-11, -8]]){ const w = cyl(4, 4, 3, 0x111827, x, 0, z, 16); w.rotation.x = Math.PI/2; w.position.y = 4; g.add(w); }
  const hl = box(1, 2.5, 3, 0xfff7c2, 17.2, 6, 4); const hr = hl.clone(); hr.material = hl.material; hr.position.z = -4; g.add(hl, hr); g.userData.lights = [hl]; return g; }
function label(text, color){ const c = document.createElement('canvas'); c.width = 256; c.height = 64; const x = c.getContext('2d');
  x.fillStyle = 'rgba(255,255,255,.92)'; x.beginPath(); x.roundRect ? x.roundRect(2, 8, 252, 48, 14) : x.rect(2, 8, 252, 48); x.fill();
  x.fillStyle = color || '#0f172a'; x.font = 'bold 26px system-ui,Segoe UI,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, 128, 33);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(c), depthTest: false})); s.scale.set(44, 11, 1); return s; }
/// The controller board in the scene (blue Arduino Uno or black ESP32), with a label.
function controller(x, z){ const g = new THREE.Group();
  if (board === 'uno'){ g.add(box(34, 2, 26, 0x0b6fa4, 0, 0, 0)); g.add(box(8, 6, 7, 0xb0bec5, -14, 2, -6)); g.add(box(12, 2.5, 4, 0x111827, 4, 2, 0)); g.add(box(26, 3, 2, 0x111827, 2, 2, 11)); }
  else { g.add(box(26, 2, 14, 0x111111, 0, 0, 0)); g.add(box(12, 3, 10, 0xb0bec5, 4, 2, 0)); g.add(box(6, 2, 4, 0x9ca3af, -11, 2, 0)); }
  const l = label(board === 'uno' ? 'Arduino Uno' : 'ESP32', '#0077b6'); l.position.set(0, 16, 0); g.add(l); g.position.set(x, 0, z); world.add(g); return g; }
function wire(a, b, color){ const pts = []; for (let i = 0; i <= 16; i++){ const t = i/16; pts.push(new THREE.Vector3(a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t + Math.sin(Math.PI*t)*10, a[2] + (b[2]-a[2])*t)); }
  const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, .8, 6, false), M(color)); world.add(m); }

// ---------------------------------------------------------------- Arduino runtime (pins driven by the student's code)
const HIGH = 1, LOW = 0, OUTPUT = 1, INPUT = 0, INPUT_PULLUP = 2, A0 = 14, A1 = 15, A2 = 16, A3 = 17, A4 = 18, A5 = 19;
let pins = {}, simT = 0, waits = [], running = false, stopReq = false, delayCount = 0, yields = 0, lastError = '';
const STOP = {stop: true};
const ADC = () => board === 'uno' ? 1023 : 4095;
function P(key){ return model.pins[board][key][0]; }          // pin number for a part on this board
function pinOf(n){ return pins[n] || (pins[n] = {mode: 0, v: 0, pwm: null, servo: null}); }
function pinMode(p, m){ pinOf(p).mode = m; }
function digitalWrite(p, v){ const q = pinOf(p); q.v = v ? 1 : 0; q.pwm = null; }
function analogWrite(p, v){ const q = pinOf(p); q.pwm = Math.max(0, Math.min(255, Math.round(v))); q.v = q.pwm > 0 ? 1 : 0; }
function keyOfPin(p){ for (const k in model.pins[board]) if (model.pins[board][k][0] === p) return k; return null; }
function analogRead(p){ const k = keyOfPin(p); if (!k) return 0; if (model.read && model.read[k]) return Math.round(model.read[k]()*ADC());
  const inp = model.inputs.find(i => i.pin === k); return inp ? Math.round((inputs[inp.id]||0)/100*ADC()) : 0; }
function digitalRead(p){ const k = keyOfPin(p); if (!k) return pinOf(p).v; if (model.read && model.read[k]) return model.read[k]() ? HIGH : LOW;
  const inp = model.inputs.find(i => i.pin === k); return inp ? (inputs[inp.id] ? HIGH : LOW) : LOW; }
function level(key){ const q = pins[P(key)]; if (!q) return 0; return q.pwm != null ? q.pwm/255 : q.v; }
function servoAngle(key, def){ const q = pins[P(key)]; return q && q.servo != null ? q.servo : def; }
class Servo { attach(p){ this.p = p; pinOf(p).mode = OUTPUT; } write(a){ if (this.p != null) pinOf(this.p).servo = Math.max(0, Math.min(180, +a)); } read(){ return this.p != null ? (pinOf(this.p).servo || 0) : 0; } }
function millis(){ return Math.floor(simT); }
function map(x, a, b, c, d){ return Math.round((x - a)*(d - c)/(b - a) + c); }
function constrain(x, a, b){ return Math.max(a, Math.min(b, x)); }
function random(a, b){ if (b === undefined){ b = a; a = 0; } return Math.floor(a + Math.random()*(b - a)); }
const abs = Math.abs, min = Math.min, max = Math.max;
let serialLine = '';
const Serial = {begin(){}, print(x){ serialLine += String(x); }, println(x){ serialLine += (x === undefined ? '' : String(x)); addSerial(serialLine); serialLine = ''; }};
function delay(ms){ ms = Math.max(0, +ms || 0); delayCount++; return new Promise((res, rej) => { if (stopReq) return rej(STOP); waits.push({until: simT + ms, res, rej}); }); }
function __y(){ if (stopReq) return Promise.reject(STOP); if (++yields % 500 === 0) return delay(0); return Promise.resolve(); }
const API = {HIGH, LOW, OUTPUT, INPUT, INPUT_PULLUP, A0, A1, A2, A3, A4, A5, pinMode, digitalWrite, digitalRead, analogWrite, analogRead, delay, millis, map, constrain, random, abs, min, max, Serial, Servo, __y};
const AWAITED = ['delay'];
function translate(src){
  let s = src.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*$/gm,'');
  s = s.replace(/^\s*#include.*$/gm,'');
  s = s.replace(/^\s*#define\s+(\w+)\s+(.+)$/gm,'const $1 = $2;');
  s = s.replace(/\((?:unsigned\s+)?(?:int|long|float|double|byte|char|bool|boolean)\)/g,'');
  const fns=[];
  s = s.replace(/\b(?:void|int|long|float|double|bool|boolean|byte|char|String|unsigned\s+int|unsigned\s+long)\s+(\w+)\s*\(([^)]*)\)\s*\{/g,(m,name,params)=>{
    fns.push(name);
    const ps = params.split(',').map(x=>x.trim()).filter(x=>x && x!=='void').map(x=>x.split(/[\s*&]+/).pop());
    return `async function ${name}(${ps.join(', ')}) {`;
  });
  s = s.replace(/\b(?:const\s+)?(?:unsigned\s+)?(?:int|long|float|double|bool|boolean|byte|char|String)\s+(?=[A-Za-z_])/g,'let ');
  s = s.replace(/\bboolean\b/g,'let');
  for (const n of [...fns, ...AWAITED]) s = s.replace(new RegExp(`(?<!function\\s)(?<![\\w.])${n}\\s*\\(`,'g'), `await ${n}(`);
  s = s.replace(/\b(while|for)\s*\(((?:[^()]|\([^()]*\))*)\)\s*\{/g, m => m + ' await __y();');
  s = s.replace(/\bdo\s*\{/g, m => m + ' await __y();');
  return s + '\nreturn {setup: typeof setup==="function"?setup:null, loop: typeof loop==="function"?loop:null};';
}

function translate2(src){ return translate(src.replace(/\bServo\s+(\w+)\s*;/g, 'Servo $1 = new Servo();').replace(/\bServo\s+(\w+)\s*=\s*new Servo\(\)\s*;/g, 'let $1 = new Servo();')); }
async function compile(src){ const AF = Object.getPrototypeOf(async function(){}).constructor; const names = Object.keys(API);
  return new AF(...names, translate2(src))(...names.map(n => API[n])); }
async function run(){
  stop(); await new Promise(r => setTimeout(r, 30));
  pins = {}; simT = 0; waits = []; stopReq = false; delayCount = 0; yields = 0; lastError = ''; clearSerial(); if (model.reset) model.reset();
  let prog; try { prog = await compile(code.value); } catch(e){ lastError = e.message; addSerial('Code error: ' + e.message, true); setStatus('Code error', 'bad'); return; }
  running = true; setStatus('Running on ' + (board === 'uno' ? 'Arduino Uno' : 'ESP32'), 'run');
  try { if (prog.setup) await prog.setup(); while (!stopReq && prog.loop){ const c = delayCount; await prog.loop(); if (delayCount === c) await delay(0); } }
  catch(e){ if (e !== STOP){ lastError = String(e.message || e); addSerial('Runtime error: ' + lastError, true); setStatus('Runtime error', 'bad'); } }
  running = false; if (!lastError) setStatus('Stopped', '');
}
function stop(){ stopReq = true; waits.forEach(w => w.rej(STOP)); waits = []; }
function tick(){ return new Promise(r => { const ch = new MessageChannel(); ch.port1.onmessage = () => r(); ch.port2.postMessage(0); }); }
// ---------------------------------------------------------------- the 5 models: real parts, real pins, real code
const B = b => b === 'uno' ? 'Arduino Uno' : 'ESP32';
function codeHeader(m, b){ return `// ${m.name} - ${B(b)}\n` + m.partsList.map(([k, part]) => `const int ${k.padEnd(9)} = ${m.pins[b][k][1]};`.padEnd(32) + `// ${part}`).join('\n') + '\n'; }
const MODELS = [
 { id: 'street', name: 'Auto street lights', sky: 0xbfe3f7,
   desc: 'A light sensor (LDR) tells the board when it gets dark. Your code switches the street lamp LEDs on at night and drives the car when its switch is on.',
   partsList: [['LDR', 'Light sensor: LDR + 10k resistor'], ['LAMPS', 'Street lamp LEDs (220 ohm each)'], ['CAR_BTN', 'Car switch (slide switch)'], ['MOTOR', 'Car motor via L298N driver']],
   pins: {uno: {LDR: [A0, 'A0'], LAMPS: [9, '9'], CAR_BTN: [2, '2'], MOTOR: [5, '5']}, esp: {LDR: [34, '34'], LAMPS: [25, '25'], CAR_BTN: [27, '27'], MOTOR: [26, '26']}},
   inputs: [{id: 'day', type: 'range', label: 'Daylight on the LDR', pin: 'LDR', def: 80, unit: '%'}, {id: 'carsw', type: 'toggle', label: 'Car switch', pin: 'CAR_BTN', def: 0}],
   code(b){ return codeHeader(this, b) + `
void setup() {
  pinMode(LAMPS, OUTPUT);
  pinMode(MOTOR, OUTPUT);
  pinMode(CAR_BTN, INPUT);
  Serial.begin(${b === 'uno' ? 9600 : 115200});
}

void loop() {
  int light = map(analogRead(LDR), 0, ${b === 'uno' ? 1023 : 4095}, 0, 100);   // 0 = dark, 100 = bright
  Serial.print("Light: ");
  Serial.println(light);

  if (light < 30) {
    digitalWrite(LAMPS, HIGH);   // dark: lamps ON
  } else {
    digitalWrite(LAMPS, LOW);    // bright: lamps OFF
  }

  if (digitalRead(CAR_BTN) == HIGH) {
    analogWrite(MOTOR, 180);     // car drives
  } else {
    analogWrite(MOTOR, 0);       // car stops
  }
  delay(200);
}`; },
   how: ['The LDR resistance goes up in the dark, so the voltage on the analog pin changes. analogRead() turns it into a number.', 'map() changes that number to 0-100 so it is easy to compare. Below 30 means it is dark.', 'digitalWrite(LAMPS, HIGH) sends 5 V (3.3 V on ESP32) to the LEDs: the lamps turn on.', 'analogWrite() sets the motor speed with PWM (0 = stop, 255 = full speed). Try lamps that get brighter as it gets darker!'],
   build(){ world.add(ground(300, 180, 0x7bc96f)); world.add(box(290, 1, 40, 0x374151, 0, 0, 15));

const ACTS = {glow: 'Glow (light)', spin: 'Spin (motor)', move: 'Move to and fro', fill: 'Fill with water', drain: 'Drain water', flow: 'Water flows', show: 'Appear', hide: 'Disappear', servo: 'Turn to servo angle'};

const int BTN_A = 2;     // button A: "night" switch
const int BTN_B = 3;     // button B: "car" switch
const int KNOB  = A0;    // knob: wind speed

const int CAR   = 5;     // car motor       (behaviour: move when pin 5 HIGH)
const int MILL  = 6;     // windmill motor  (behaviour: spin when pin 6 HIGH)
const int WALK  = 10;    // walk light      (behaviour: student moves when pin 10 HIGH)

void setup() {
  pinMode(BTN_A, INPUT);
  pinMode(BTN_B, INPUT);
  pinMode(LAMPS, OUTPUT);
  pinMode(CAR, OUTPUT);
  pinMode(MILL, OUTPUT);
  pinMode(WALK, OUTPUT);
  Serial.begin(9600);
}

void loop() {
  digitalWrite(LAMPS, digitalRead(BTN_A));        // night -> lamps on
  if (digitalRead(BTN_B) == HIGH) {               // car switch
    digitalWrite(CAR, HIGH);
    digitalWrite(WALK, LOW);                      // cars moving: nobody crosses
  } else {
    digitalWrite(CAR, LOW);
    digitalWrite(WALK, HIGH);                     // road is clear: student crosses
  }
  int wind = map(analogRead(KNOB), 0, 1023, 0, 255);
  analogWrite(MILL, wind);                        // windmill speed follows the knob

function pinNum(tag){ return +String(tag).replace(/^(uno|esp)/, ''); }     // 'uno9' -> 9
function pinTag(n){ return (board === 'uno' ? 'uno' : 'esp') + n; }
function pinLabel(n){ return board === 'uno' ? (n >= 14 ? 'A' + (n - 14) : 'D' + n) : 'GPIO ' + n; }
function levelPin(n){ const q = pins[n]; if (q) return q.pwm != null ? q.pwm/255 : q.v; const k = Object.keys(CREATE_IN[board]).find(k => CREATE_IN[board][k][0] === n);
  if (k){ const i = CREATE_MODEL.inputs.find(i => i.pin === k); return i ? (i.type === 'range' ? (inputs[i.id]||0)/100 : (inputs[i.id] ? 1 : 0)) : 0; } return 0; }

  get pins(){ const o = {uno: {...CREATE_IN.uno}, esp: {...CREATE_IN.esp}}; for (const p of cparts) for (const b of p.behs){ const n = pinNum(b.pin); o.uno['PIN' + n] = [n, String(n)]; o.esp['PIN' + n] = [n, String(n)]; } return o; },

    for (const p of cparts) for (const b of p.behs){ const n = pinNum(b.pin); (used[n] = used[n] || []).push(KINDS[p.kind][0] + ' ' + b.act); }
    for (const n in used) l.push(['PIN' + n, used[n].join(', ')]); return l; },
  inputs: [{id: 'btna', type: 'toggle', label: 'Button A', pin: 'BTN_A', def: 0}, {id: 'btnb', type: 'toggle', label: 'Button B', pin: 'BTN_B', def: 0}, {id: 'knob', type: 'range', label: 'Knob', pin: 'KNOB', def: 50, unit: '%'}],
  how: ['Every part can have behaviours. A behaviour has an ACTION (glow, spin, move...) and a PIN: it runs while that pin is HIGH (or LOW).', 'Your code sets the pins with digitalWrite() or analogWrite(). With analogWrite the speed or brightness follows the value.', 'Inputs: Button A and Button B are digital pins, the knob is an analog pin. Read them with digitalRead() and analogRead().', 'Build a real version: LEDs for glow, DC motors for spin and move, a servo for gates, a relay and pump for water.'],

    const ins = CREATE_IN[b]; return `// My model - ${B(b)}
const int BTN_A = ${ins.BTN_A[1]};     // button A
const int BTN_B = ${ins.BTN_B[1]};     // button B
const int KNOB  = ${ins.KNOB[1]};    // knob (analog)

void setup() {
  pinMode(BTN_A, INPUT);
  pinMode(OUT1, OUTPUT);

}

void loop() {
  if (digitalRead(BTN_A) == HIGH) {
    digitalWrite(OUT1, HIGH);
  } else {
    digitalWrite(OUT1, LOW);
  }
  delay(100);
}`; },

  build(){ world.add(ground(320, 220, 0xe2e8f0)); world.add(box(300, 2, 200, 0xf8fafc, 0, 0, 0)); controller(-130, -85); cnodes = {};
    for (const p of cparts){ const g = KINDS[p.kind][2](); g.position.set(p.x, 2, p.z); g.rotation.y = (p.rot || 0)*Math.PI/4; g.scale.setScalar(p.s || 1); g.userData.pid = p.id;
      g.traverse(o => { if (o.isMesh){ o.material = o.material.clone(); o.userData.pid = p.id; } }); world.add(g); cnodes[p.id] = {g, base: {x: p.x, z: p.z}, t: 0, lvl: .3};
      const lights = []; g.traverse(o => { if (o.isMesh && o.name === 'bulb') lights.push(o); }); if (p.behs.some(b => b.act === 'glow')){ const pl = new THREE.PointLight(0xfff1b8, 0, 120); pl.position.y = 40; g.add(pl); cnodes[p.id].pl = pl; }
      if (selected === p.id){ const ring = cyl(30*(p.s||1), 30*(p.s||1), .6, 0x7c3aed, p.x, 2.2, p.z, 40, {transparent: true, opacity: .35}); world.add(ring); } }

      for (const b of p.behs){ const lv = levelPin(pinNum(b.pin)); const on = b.when === 'always' ? 1 : (b.when === 'LOW' ? (lv > 0 ? 0 : 1) : lv);
        const spin = n.g.getObjectByName('spinner');
        if (b.act === 'glow') glow = Math.max(glow, on);
        if (b.act === 'spin' && on > 0){ if (spin) spin.rotation[(p.kind === 'gear' || p.kind === 'crane') ? 'y' : 'z'] -= dt*6*on; else n.g.rotation.y += dt*2*on; }
        if (b.act === 'move'){ if (on > 0) n.t += dt*on*.6; const d = (b.amt || 60), ph = (n.t % 2), off = (ph < 1 ? ph : 2 - ph)*d; const a = n.g.rotation.y; n.g.position.x = n.base.x + Math.cos(a)*off; n.g.position.z = n.base.z - Math.sin(a)*off; }

  if (p){ el.querySelectorAll('[data-a]').forEach(b => { const a = b.dataset.a;
      if (a === 'size') b.oninput = e => { p.s = e.target.value/100; rebuildCreate(); };
      else b.onclick = () => { if (a === 'rotl') p.rot = (p.rot||0) + 1; if (a === 'rotr') p.rot = (p.rot||0) - 1; if (a === 'del'){ cparts = cparts.filter(x => x !== p); selected = null; } rebuildCreate(); }; });
    el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { p.behs.splice(+b.dataset.del, 1); rebuildCreate(); });
    el.querySelector('#bAdd').onclick = () => { const act = el.querySelector('#bAct').value; p.behs.push({act, pin: pinTag(+el.querySelector('#bPin').value), when: el.querySelector('#bWhen').value, amt: act === 'move' ? 60 : undefined}); rebuildCreate(); }; }
}
function loadDemo(){ board = 'uno'; cparts = DEMO.parts.map((p, i) => ({id: i + 1, rot: 0, s: 1, behs: [], ...p, behs: (p.behs || []).map(b => ({...b}))})); cid = cparts.length + 1; cparts._demo = true; selected = null;
  loadModel(CREATE_MODEL); code.value = DEMO.code; addSerial('Demo loaded: press Upload & Run, then use Button A (night), Button B (car) and the Knob (wind).'); }

// picking and dragging parts in the 3D view
let dragPart = null; const ray = has3D ? new THREE.Raycaster() : null, plane = has3D ? new THREE.Plane(new THREE.Vector3(0, 1, 0), -2) : null;
function ndc(e){ const r = renderer.domElement.getBoundingClientRect(); return new THREE.Vector2(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1); }
function pickPart(e){ if (!has3D || model !== CREATE_MODEL) return null; ray.setFromCamera(ndc(e), camera); const hits = ray.intersectObjects(world.children, true);
  for (const h of hits){ if (h.object.userData.pid) return cparts.find(p => p.id === h.object.userData.pid); } return null; }
function dragTo(e){ ray.setFromCamera(ndc(e), camera); const pt = new THREE.Vector3(); if (ray.ray.intersectPlane(plane, pt) && dragPart){ dragPart.x = Math.max(-150, Math.min(150, pt.x)); dragPart.z = Math.max(-100, Math.min(100, pt.z));
  const n = cnodes[dragPart.id]; if (n){ n.g.position.x = dragPart.x; n.g.position.z = dragPart.z; n.base = {x: dragPart.x, z: dragPart.z}; } } }
// ---------------------------------------------------------------- 3D setup
function setSky(c, light){ if (!has3D) return; scene.background.setHex(c); sun.intensity = .9*light; hemi.intensity = .35 + .55*light; }
function init3D(){
  renderer = new THREE.WebGLRenderer({antialias: true}); renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1)); renderer.shadowMap.enabled = true;
  stage.insertBefore(renderer.domElement, stage.firstChild);
  scene = new THREE.Scene(); scene.background = new THREE.Color(0xbfe3f7);
  camera = new THREE.PerspectiveCamera(42, 1, 1, 4000);
  hemi = new THREE.HemisphereLight(0xffffff, 0x64748b, .9); scene.add(hemi);
  sun = new THREE.DirectionalLight(0xffffff, .9); sun.position.set(120, 220, 140); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, {left: -200, right: 200, top: 200, bottom: -200, far: 700}); scene.add(sun);
  let drag = null; const c = renderer.domElement;
  c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); const hit = pickPart(e);
    if (hit){ dragPart = hit; if (selected !== hit.id){ selected = hit.id; renderBuilder(); } return; }
    drag = {x: e.clientX, y: e.clientY, t: camTheta, p: camPhi}; });
  c.addEventListener('pointermove', e => { if (dragPart){ dragTo(e); return; } if (!drag) return; camTheta = drag.t - (e.clientX - drag.x)*.008; camPhi = Math.max(.25, Math.min(1.45, drag.p - (e.clientY - drag.y)*.006)); });
  c.addEventListener('pointerup', () => { drag = null; if (dragPart){ dragPart = null; rebuildCreate(); } });
  c.addEventListener('wheel', e => { e.preventDefault(); camDist = Math.max(140, Math.min(800, camDist*(e.deltaY > 0 ? 1.1 : .9))); }, {passive: false});
  new ResizeObserver(resize).observe(stage); resize();
}
function resize(){ if (!has3D) return; const w = stage.clientWidth||600, h = stage.clientHeight||400; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); }

// ---------------------------------------------------------------- panel
const code = document.getElementById('code'), serialEl = document.getElementById('serial'), statusEl = document.getElementById('status');
function setStatus(t, c){ statusEl.textContent = t; statusEl.className = c || ''; }
function addSerial(t, err){ const d = document.createElement('div'); if (err) d.className = 'err'; d.textContent = t; serialEl.appendChild(d); while (serialEl.childNodes.length > 150) serialEl.removeChild(serialEl.firstChild); serialEl.scrollTop = serialEl.scrollHeight; }
function clearSerial(){ serialEl.innerHTML = ''; serialLine = ''; }

function loadModel(m, keepBoard){
  stop(); model = m; anim = []; pins = {}; for (const k in sim) delete sim[k]; if (m.reset) m.reset();
  for (const k in inputs) delete inputs[k]; m.inputs.forEach(i => inputs[i.id] = i.def);
  if (has3D){ if (world) scene.remove(world); world = new THREE.Group(); scene.add(world); setSky(m.sky, 1); m.build(); }
  document.getElementById('badge').textContent = m.name + '  ·  ' + B(board);
  document.getElementById('title').textContent = m.name;
  document.getElementById('desc').textContent = m.desc;
  document.getElementById('how').innerHTML = m.how.map(t => '<li>' + t + '</li>').join('');
  document.getElementById('warn').style.display = 'none';
  document.getElementById('zola').style.display = 'none';
  document.getElementById('bUno').classList.toggle('on', board === 'uno'); document.getElementById('bEsp').classList.toggle('on', board === 'esp');
  document.getElementById('parts').innerHTML = '<tr><th>Part</th><th>' + B(board) + ' pin</th></tr>' +
    m.partsList.map(([k, part]) => '<tr><td>' + part + '</td><td><code>' + (board === 'uno' ? (/^A/.test(m.pins.uno[k][1]) ? m.pins.uno[k][1] : 'D' + m.pins.uno[k][1]) : 'GPIO ' + m.pins.esp[k][1]) + '</code></td></tr>').join('') +
    '<tr><td>Power</td><td><code>' + (board === 'uno' ? '5V + GND' : '3.3V + GND') + '</code></td></tr>';
  const box = document.getElementById('inputs'); box.innerHTML = '';
  m.inputs.forEach(i => { const d = document.createElement('div');
    if (i.type === 'range'){ d.className = 'inp'; d.innerHTML = '<label><span>' + i.label + (i.pin ? ' <code style="font-size:11px">' + i.pin + '</code>' : '') + '</span><span id="v_' + i.id + '">' + i.def + i.unit + '</span></label><input type="range" min="0" max="100" value="' + i.def + '">';
      d.querySelector('input').oninput = e => { inputs[i.id] = +e.target.value; document.getElementById('v_' + i.id).textContent = e.target.value + i.unit; }; }
    else { d.className = 'tgl' + (i.def ? ' on' : ''); d.innerHTML = '<span>' + i.label + (i.pin ? ' <code style="font-size:11px">' + i.pin + '</code>' : '') + '</span><div class="tg"></div>';
      d.onclick = () => { inputs[i.id] = inputs[i.id] ? 0 : 1; d.classList.toggle('on', !!inputs[i.id]); }; }
    box.appendChild(d); });
  code.value = m.code(board);
  document.getElementById('codeTitle').textContent = (board === 'uno' ? 'Arduino Uno' : 'ESP32') + ' code (Arduino C++)';
  clearSerial(); setStatus('Ready: press Upload & Run', ''); renderTabs(); renderBuilder();
}
function renderTabs(){ const t = document.getElementById('tabs'); t.innerHTML = '';
  MODELS.forEach(m => { const b = document.createElement('button'); b.className = 'tab' + (m === model ? ' on' : '') + (m.id === 'create' ? ' create' : ''); b.textContent = m.name; b.onclick = () => loadModel(m); t.appendChild(b); }); }
document.getElementById('bUno').onclick = () => { if (board !== 'uno'){ board = 'uno'; loadModel(model); } };
document.getElementById('bEsp').onclick = () => { if (board !== 'esp'){ board = 'esp'; loadModel(model); } };
document.getElementById('runBtn').onclick = () => run();
document.getElementById('stopBtn').onclick = () => { stop(); setStatus('Stopped', ''); };
document.getElementById('resetBtn').onclick = () => { if (confirm('Put the starter code back?')) code.value = model.code(board); };
code.addEventListener('keydown', e => { if (e.key === 'Tab'){ e.preventDefault(); const s = code.selectionStart; code.value = code.value.slice(0, s) + '  ' + code.value.slice(code.selectionEnd); code.selectionStart = code.selectionEnd = s + 2; } });

function pinsHtml(){ return model.partsList.map(([k, part]) => { const p = P(k), q = pins[p]; const inp = model.inputs.find(i => i.pin === k);
    let st = '-';
    if (q && q.servo != null) st = q.servo + '°';
    else if (q && q.pwm != null) st = 'PWM ' + q.pwm;
    else if (q && q.mode === OUTPUT) st = q.v ? 'HIGH' : 'LOW';
    else if (inp) st = inp.type === 'range' ? 'in ' + Math.round((inputs[inp.id]||0)/100*ADC()) : (inputs[inp.id] ? 'HIGH' : 'LOW');
    else if (model.read && model.read[k]) { const r = model.read[k](); st = typeof r === 'boolean' || r === 0 || r === 1 && k === 'IR' ? (r ? 'HIGH' : 'LOW') : 'in ' + Math.round(r*ADC()); }
    const on = /HIGH|PWM [1-9]|°/.test(st) && !/PWM 0/.test(st);
    return '<span class="lbl">' + (board === 'uno' ? (/^A/.test(model.pins.uno[k][1]) ? model.pins.uno[k][1] : 'D' + model.pins.uno[k][1]) : 'GPIO' + model.pins.esp[k][1]).padEnd(7) + '</span>' + k.padEnd(9) + ' <span class="' + (on ? 'on' : '') + '">' + st + '</span>'; }).join('<br>'); }

// ---------------------------------------------------------------- frame: simulator time is shared with the student's delay()
let last = performance.now(), busy = false;
async function frame(now){ requestAnimationFrame(frame); if (busy) return; busy = true;
  const dt = Math.min(.05, (now - last)/1000); last = now; clock += dt;
  let budget = dt*1000, guard = 0;
  while (budget > 0 && guard++ < 200){ const h = Math.min(5, budget); budget -= h; simT += h;
    const due = waits.filter(w => w.until <= simT); if (due.length){ waits = waits.filter(w => w.until > simT); due.forEach(w => w.res()); await tick(); } }
  anim.forEach(f => f(dt));
  document.getElementById('pins').innerHTML = pinsHtml().replace(/ /g, '&nbsp;').replace(/<span&nbsp;class/g, '<span class');
  if (has3D){ camera.position.set(camDist*Math.sin(camPhi)*Math.cos(camTheta), camDist*Math.cos(camPhi), camDist*Math.sin(camPhi)*Math.sin(camTheta)); camera.lookAt(0, 10, 0); renderer.render(scene, camera); }
  busy = false; }

// ---------------------------------------------------------------- Zola (through the app)
function send(o){ const s = JSON.stringify(o); try { if (window.LxBridge) window.LxBridge.postMessage(s); else window.parent.postMessage(s, '*'); } catch(e) {} }
document.getElementById('zbtn').onclick = () => {
  const z = document.getElementById('zola'), zt = document.getElementById('zolaText'); z.style.display = 'block'; zt.textContent = 'Zola is looking at your circuit and code...';
  const asked = Date.now(); window.__asked = asked;
  setTimeout(() => { if (window.__asked === asked && zt.textContent.startsWith('Zola is looking')) zt.textContent = 'Zola is taking too long. Please check that the Learnix backend is running and try again.'; }, 45000);
  send({type: 'zola', mode: 'model', model: model.name, board: B(board), desc: model.desc, how: model.how.join(' '),
        parts: model.partsList.map(([k, part]) => k + ' = ' + part + ' on pin ' + model.pins[board][k][1]).join('; '),
        pins: pinsHtml().replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' '), inputs: JSON.stringify(inputs), code: code.value,
        serial: [...serialEl.childNodes].slice(-12).map(n => n.textContent).join('\n'), error: lastError, running,
        question: document.getElementById('ask').value.trim()});
};
function onApp(s){ try { const m = JSON.parse(s); if (m.type === 'zola' && typeof m.text === 'string'){ window.__asked = 0; document.getElementById('zola').style.display = 'block'; document.getElementById('zolaText').textContent = m.text; } } catch(e) {} }
window.__lxIn = onApp; window.addEventListener('message', e => { if (typeof e.data === 'string') onApp(e.data); });

if (has3D) init3D(); else stage.insertAdjacentHTML('beforeend', '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center">The 3D view needs internet (three.js). The code still runs: watch the pin states.</div>');
loadModel(MODELS[0]);
requestAnimationFrame(frame);
})();
</script></body></html>
