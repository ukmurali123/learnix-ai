<!DOCTYPE html>
<html>
<head>
  <base href="/flutter/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Learnix AI: every child gets a robotics lab, even without a kit.">
  <meta name="theme-color" content="#0077B6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Learnix AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <!-- start downloading the rendering engine while the page is still loading -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <title>Learnix AI</title>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    #lx-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; background: #ffffff; font-family: system-ui, Segoe UI, Roboto, sans-serif; transition: opacity .4s ease; z-index: 9999; }
    #lx-splash img { width: 220px; max-width: 60vw; animation: lx-pop .8s ease both; }
    #lx-splash .bar { width: 180px; height: 6px; border-radius: 6px; background: #e6f4fb; overflow: hidden; }
    #lx-splash .bar i { display: block; width: 40%; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #0077B6, #E65100);
      animation: lx-slide 1.1s ease-in-out infinite; }
    #lx-splash p { margin: 0; color: #64748b; font-size: 14px; font-weight: 600; }
    #lx-splash.hide { opacity: 0; pointer-events: none; }
    @keyframes lx-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @keyframes lx-pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <!-- Shown instantly while Flutter downloads its engine and app code (otherwise the page is blank) -->
  <div id="lx-splash">
    <img src="learnix_logo.png" alt="Learnix">
    <div class="bar"><i></i></div>
    <p>Loading your robotics lab...</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('lx-splash');
      if (s) { s.classList.add('hide'); setTimeout(function () { s.remove(); }, 450); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
